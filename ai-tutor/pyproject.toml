[project]
name = "ai-tutor"
version = "0.1.0"
description = "AI 私教系统 - 基于 RAG 的编程学习助手"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Tutor Team"}
]
readme = "README.md"

dependencies = [
    # Web Framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    
    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.0",
    
    # Redis
    "redis[hiredis]>=5.2.0",
    
    # LLM & Embedding
    "litellm>=1.52.0",
    "httpx>=0.28.0",
    
    # Document Processing
    "trafilatura>=2.0.0",
    "unstructured>=0.16.0",
    "langchain-text-splitters>=0.3.0",
    "pypdf>=5.0.0",
    
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    
    # Utilities
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    
    # SSE
    "sse-starlette>=2.1.0",
    
    # Observability
    "langfuse>=2.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "ARG", "PTH", "ERA"]
# The codebase stores naive UTC datetimes throughout (SQLAlchemy DateTime(timezone=True)
# columns written with datetime.utcnow). Migrating to aware datetimes is a separate
# behavioral change; excluding here keeps the lint gate green without runtime risk.
# TID252: each service is a standalone deployable container (root package name differs
# between repo layout and container), so intra-service parent-relative imports are
# intentional and converting them to absolute would couple code to deployment naming.
# COM812 (missing trailing comma) is owned by ruff-format; enabling both produces conflicting fixes.
ignore = ["DTZ001", "DTZ003", "TID252", "COM812"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
# Tests: assert, private-member access, fixture constants, and unused fixture/mock
# arguments are idiomatic in tests
"**/tests/**/*.py" = ["S101", "SLF001", "S105", "S106", "ARG001", "ARG002"]
# FastAPI route/signature files: args are the auth/DI contract even when unused
"**/app/api/**/*.py" = ["ARG001", "ARG002", "S110"]
"**/app/main.py" = ["ARG001"]
# S105 false positives: JWT_SECRET is a dev-only default overridden by env vars;
# token_type="bearer" is an OAuth scheme constant, not a credential
"shared/utils/config.py" = ["S105"]
"shared/models/user.py" = ["S105"]
# Hyphenated service packages are deployable dirs, not importable module names
"feynman-agent/**/*.py" = ["N999"]
"knowledge-agent/**/*.py" = ["N999"]
"rag-agent/**/*.py" = ["N999"]
"quiz-agent/**/*.py" = ["N999"]
"review-agent/**/*.py" = ["N999"]
"progress-agent/**/*.py" = ["N999"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
