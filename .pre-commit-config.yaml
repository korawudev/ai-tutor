# ==============================================
# ai-tutor pre-commit hooks
# Install: python3 -m pip install --user pre-commit && pre-commit install
# Run all: pre-commit run --all-files
# ==============================================

repos:
  # ---- Python: lint + format (astral-sh ruff, self-contained) ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---- Local hooks ----
  - repo: local
    hooks:
      # Frontend TypeScript type check (matches Makefile `lint` target)
      - id: frontend-tsc
        name: frontend typecheck (tsc --noEmit)
        entry: bash -c 'export PATH="/Users/shine/.nvm/versions/node/v20.18.0/bin:$PATH" && cd ai-tutor/web-app && npx tsc --noEmit --pretty false'
        language: system
        files: ^ai-tutor/web-app/.*\.(ts|tsx)$
        pass_filenames: false